name: Update Product Previews

on:
  workflow_dispatch:
  push:
    paths:
      - 'assets/images/products/**'

permissions:
  contents: write

concurrency:
  group: midori-product-preview
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install preview dependency
        run: python -m pip install -r tools/requirements-preview.txt

      - name: Apply photo-first share preview
        run: python tools/ensure_photo_first_share_preview.py

      - name: Generate product pages, sitemap, and share previews
        run: python tools/generate_product_previews.py --source auto --write-fallback

      - name: Report catalog source
        shell: bash
        run: |
          SOURCE_USED="$(python -c 'import json; print(json.load(open("tools/preview-generation-report.json", encoding="utf-8"))["catalog_source"])')"
          echo "Catalog source used: ${SOURCE_USED}"
          if [ "${SOURCE_USED}" != "live" ]; then
            echo "::warning::Google Sheets LIVE tidak dapat diakses. Preview dibuat dari catalog-data.js lokal agar workflow tetap aman dan tidak gagal."
            {
              echo "### ⚠️ Google Sheets LIVE unavailable"
              echo "Preview berhasil dibuat menggunakan fallback lokal assets/data/catalog-data.js."
              echo "Data katalog baru dari Google Sheets belum tersinkron sampai endpoint LIVE kembali tersedia."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### ✅ Google Sheets LIVE" >> "$GITHUB_STEP_SUMMARY"
            echo "Preview dibuat dari katalog LIVE." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Commit generated previews
        shell: bash
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Tidak ada perubahan preview."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            produk \
            assets/images/share \
            assets/data/catalog-data.js \
            index.html \
            katalog.html \
            assets/js/app.js \
            tools/generate_product_previews.py \
            tools/preview-generation-report.json \
            sitemap.xml \
            robots.txt \
            PROJECT-STATE.md \
            CHANGELOG-v4.12.4.md \
            .nojekyll
          git commit -m "Release v4.12.4 photo-first share preview"
          git push
