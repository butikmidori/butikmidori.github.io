name: Update Product Previews

on:
  workflow_dispatch:
  push:
    paths:
      - 'assets/images/products/**'

permissions:
  contents: write

concurrency:
  group: midori-product-preview
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install preview dependency
        run: python -m pip install -r tools/requirements-preview.txt

      - name: Apply portrait product share preview
        run: python tools/ensure_share_preview_45.py

      - name: Generate product pages, sitemap, and share previews
        run: python tools/generate_product_previews.py --source live --write-fallback

      - name: Commit generated previews
        shell: bash
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Tidak ada perubahan preview."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            produk \
            assets/images/share \
            assets/data/catalog-data.js \
            index.html \
            katalog.html \
            assets/js/app.js \
            tools/generate_product_previews.py \
            tools/preview-generation-report.json \
            sitemap.xml \
            robots.txt \
            PROJECT-STATE.md \
            CHANGELOG-v4.12.1.md \
            .nojekyll
          git commit -m "Release v4.12.1 portrait product share previews"
          git push
